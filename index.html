<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamento</title>

<!-- Ícone da tela de início. É exatamente o que o Apps Script não permite
     declarar: o iPhone lê a apple-touch-icon desta página ao criar o atalho. -->
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- Abre sem a barra do Safari quando iniciado pelo atalho -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planejamento">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5A0F11">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --bordo:#5A0F11; --azul:#B9D1DB; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bordo);color:#fff;
  font-family:"Fira Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ---- o sistema, ocupando a tela toda ---- */
#quadro{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bordo)}
#quadro.ativo{display:block}

/* ---- telas de apoio ---- */
.tela{
  display:none;position:fixed;inset:0;z-index:2;background:var(--bordo);
  padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 28px);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
}
.tela.ativo{display:flex}
.marca{width:104px;height:104px;border-radius:24px;display:block}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.07em}
p{margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.76);max-width:30rem}

.campo{width:100%;max-width:30rem;display:flex;flex-direction:column;gap:9px;text-align:left;margin-top:4px}
label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.7)}
input{
  width:100%;padding:13px 14px;border-radius:11px;font-size:16px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;
}
input::placeholder{color:rgba(255,255,255,.45)}
input:focus{outline:none;border-color:var(--azul);background:rgba(255,255,255,.16)}
.erro{display:none;font-size:13px;color:#FFC2C4}
.erro.ativo{display:block}

.botao{
  appearance:none;border:0;cursor:pointer;font-family:inherit;
  padding:13px 26px;border-radius:11px;font-size:15px;font-weight:600;
  background:var(--azul);color:#16323D;
}
.botao:active{filter:brightness(.93)}
.botao.secundario{background:rgba(255,255,255,.14);color:#fff}

/* ---- botão de socorro, sempre disponível ----
   Não dá para saber de fora se o Safari bloqueou o quadro: o evento de
   carregamento dispara igual. Por isso a saída fica sempre à mão, em vez
   de aparecer só quando algo "parece" ter falhado. */
#socorro{
  display:none;position:fixed;z-index:3;
  left:calc(env(safe-area-inset-left) + 10px);
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(22,50,61,.55);color:var(--azul);
  font-size:15px;line-height:34px;text-align:center;padding:0;
  backdrop-filter:blur(6px);
}
#socorro.ativo{display:block}

#menu{
  display:none;position:fixed;inset:0;z-index:4;
  background:rgba(10,3,4,.6);
  align-items:flex-end;justify-content:center;
}
#menu.ativo{display:flex}
.folha{
  width:100%;max-width:34rem;background:#1b0b0c;
  border-radius:18px 18px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;gap:10px;
}
.folha h2{margin:0 0 4px;font-size:15px;font-weight:600}
.folha .botao{width:100%;text-align:center;text-decoration:none;display:block}
</style>
</head>
<body>

<!-- Primeiro uso: pede o endereço do Web App. Fica salvo só neste aparelho,
     e não dentro do repositório, que é público. -->
<section class="tela" id="telaConfig">
  <img class="marca" src="icone-192.png" alt="">
  <h1>PLANEJAMENTO</h1>
  <p>Cole aqui o endereço do seu Planejamento no Apps Script. Ele fica salvo só neste aparelho — basta fazer isso uma vez.</p>
  <div class="campo">
    <label for="endereco">Endereço do aplicativo</label>
    <input type="url" id="endereco" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="https://script.google.com/macros/s/.../exec">
    <span class="erro" id="erro"></span>
  </div>
  <button class="botao" id="salvar" type="button">Salvar e abrir</button>
</section>

<!-- Abertura, enquanto o sistema carrega -->
<section class="tela ativo" id="telaCarregando">
  <img class="marca" src="icone-192.png" alt="">
  <h1>PLANEJAMENTO</h1>
  <p>Abrindo…</p>
</section>

<iframe id="quadro" title="Planejamento" allow="clipboard-write"></iframe>

<button id="socorro" type="button" aria-label="Opções">↗</button>

<div id="menu" role="dialog" aria-modal="true" aria-label="Opções">
  <div class="folha">
    <h2>Planejamento</h2>
    <p style="font-size:13px">Se a tela estiver em branco, abra direto no Safari.</p>
    <a class="botao" id="abrirDireto" href="#" target="_blank" rel="noopener">Abrir no Safari</a>
    <button class="botao secundario" id="trocar" type="button">Trocar endereço</button>
    <button class="botao secundario" id="fechar" type="button">Fechar</button>
  </div>
</div>

<script>
(function () {
  var CHAVE = 'planejamento_url_v1';

  var telaConfig = document.getElementById('telaConfig');
  var telaCarregando = document.getElementById('telaCarregando');
  var quadro = document.getElementById('quadro');
  var socorro = document.getElementById('socorro');
  var menu = document.getElementById('menu');
  var campo = document.getElementById('endereco');
  var erro = document.getElementById('erro');

  function lerUrl() {
    try { return localStorage.getItem(CHAVE) || ''; } catch (e) { return ''; }
  }
  function gravarUrl(valor) {
    try { localStorage.setItem(CHAVE, valor); } catch (e) { /* modo privativo */ }
  }

  /* Aceita só o endereço de implantação do Apps Script, para o quadro não
     acabar apontando para outro site por um erro de digitação. */
  function validar(valor) {
    var texto = (valor || '').trim();
    if (!texto) return 'Cole o endereço do aplicativo.';
    if (texto.indexOf('https://script.google.com/') !== 0) {
      return 'O endereço precisa começar com https://script.google.com/';
    }
    if (texto.indexOf('/exec') === -1) {
      return 'Use o endereço que termina em /exec (o da implantação, não o do editor).';
    }
    return '';
  }

  function mostrarTela(tela) {
    [telaConfig, telaCarregando].forEach(function (t) { t.classList.remove('ativo'); });
    if (tela) tela.classList.add('ativo');
  }

  function abrir(url) {
    document.getElementById('abrirDireto').href = url;
    mostrarTela(telaCarregando);
    quadro.classList.add('ativo');
    socorro.classList.add('ativo');
    quadro.src = url;
    quadro.addEventListener('load', function () { mostrarTela(null); });
  }

  function configurar() {
    quadro.classList.remove('ativo');
    quadro.removeAttribute('src');
    socorro.classList.remove('ativo');
    menu.classList.remove('ativo');
    campo.value = lerUrl();
    mostrarTela(telaConfig);
    setTimeout(function () { campo.focus(); }, 60);
  }

  document.getElementById('salvar').addEventListener('click', function () {
    var valor = campo.value.trim();
    var problema = validar(valor);
    if (problema) {
      erro.textContent = problema;
      erro.classList.add('ativo');
      return;
    }
    erro.classList.remove('ativo');
    gravarUrl(valor);
    abrir(valor);
  });

  campo.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') document.getElementById('salvar').click();
  });

  socorro.addEventListener('click', function () { menu.classList.add('ativo'); });
  document.getElementById('fechar').addEventListener('click', function () { menu.classList.remove('ativo'); });
  menu.addEventListener('click', function (ev) { if (ev.target === menu) menu.classList.remove('ativo'); });
  document.getElementById('trocar').addEventListener('click', configurar);

  var salvo = lerUrl();
  if (salvo && !validar(salvo)) abrir(salvo);
  else configurar();
})();
</script>
</body>
</html>
